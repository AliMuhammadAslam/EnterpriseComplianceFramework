<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - ComplianceAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-surface: #ffffff;
            --bg-surface-alt: #f8fafc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --error: #ef4444;
            --radius-md: 10px;
            --radius-sm: 6px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: var(--text-primary);
        }
        .login-card {
            background: var(--bg-surface);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 380px;
            padding: 2.25rem;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.75rem;
        }
        .brand .logo {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: var(--radius-sm);
        }
        .brand h1 { font-size: 1.15rem; font-weight: 700; }
        .brand span { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
        .subtitle { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1.5rem; }
        .field { margin-bottom: 1rem; }
        .field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
        }
        .field input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-primary);
            background: var(--bg-surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .field input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }
        .btn-login {
            width: 100%;
            padding: 0.7rem;
            margin-top: 0.5rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .btn-login:hover { background: var(--accent-hover); }
        .error {
            background: #fdecea;
            color: #b71c1c;
            border: 1px solid #f5c6cb;
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.75rem;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }
        .hint {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.72rem;
            color: var(--text-muted);
            line-height: 1.6;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-surface: #1e293b;
                --bg-surface-alt: #0f172a;
                --text-primary: #f8fafc;
                --text-secondary: #cbd5e1;
                --border: #334155;
            }
            .error { background: rgba(239,68,68,0.15); color: #fca5a5; border-color: rgba(239,68,68,0.3); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="logo">🛡️</div>
            <div>
                <h1>ComplianceAI</h1>
                <span>Enterprise Framework</span>
            </div>
        </div>
        <p class="subtitle">Sign in to your account to continue.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" autocomplete="on">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Sign in</button>
        </form>
    </div>
</body>
</html>
